<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cosmicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="50%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
  </defs>
  <!-- Outer ring (astrolabe frame) -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#cosmicGrad)" stroke-width="3"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#cosmicGrad)" stroke-width="1.5" opacity="0.6"/>
  <!-- Inner celestial design -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="url(#cosmicGrad)" stroke-width="2"/>
  <!-- Star/sun center -->
  <circle cx="50" cy="50" r="8" fill="url(#cosmicGrad)"/>
  <!-- Zodiac-like markers -->
  <g stroke="url(#cosmicGrad)" stroke-width="2">
    <line x1="50" y1="5" x2="50" y2="15"/>
    <line x1="50" y1="85" x2="50" y2="95"/>
    <line x1="5" y1="50" x2="15" y2="50"/>
    <line x1="85" y1="50" x2="95" y2="50"/>
  </g>
  <!-- Diagonal markers -->
  <g stroke="url(#cosmicGrad)" stroke-width="1.5" opacity="0.7">
    <line x1="18" y1="18" x2="25" y2="25"/>
    <line x1="82" y1="18" x2="75" y2="25"/>
    <line x1="18" y1="82" x2="25" y2="75"/>
    <line x1="82" y1="82" x2="75" y2="75"/>
  </g>
  <!-- Small orbit dots -->
  <circle cx="50" cy="22" r="3" fill="url(#cosmicGrad)"/>
  <circle cx="78" cy="50" r="3" fill="url(#cosmicGrad)"/>
  <circle cx="50" cy="78" r="3" fill="url(#cosmicGrad)"/>
  <circle cx="22" cy="50" r="3" fill="url(#cosmicGrad)"/>
</svg>

